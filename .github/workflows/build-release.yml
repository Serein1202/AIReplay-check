name: Build EXE & Publish Release

# ── 触发条件 ───────────────────────────────────────────────────────
# 发版方式（方案 B）：**push 到 main 就自动发版**，版本号由 CI 自动计算。
#
#   git push                # 就这一步，CI 自己算号、打包、发 Release
#
# 版本号怎么算：取仓库里**最高的已有 tag**，patch 位 +1，然后由 CI 自动打 tag。
#   例：历史最高 v1.0.2  →  本次自动发 v1.0.3，并自动 push 该 tag
#   首次（无任何 tag）  →  从 v1.0.1 起步
#
# 为什么不再用 `github.run_number`：
#   它是「本 workflow 的第几次运行」——重跑不 +1，但打 tag 会 +1，与版本语义无关。
#   混用会出现「自动生成的版本号比上一个 tag 低」，导致：
#     · releases/latest 与版本号语义错乱
#     · 老用户版本号更大，version_is_newer() 判定「无更新」→ 更新链断掉
#   现在的号完全由历史 tag 推算，天然单调递增，且 CI 仍会做一次递增保护校验。
#
# 注 1：读版本号用「历史最高的 tag」（而不是 releases/latest），这样即使某次构建失败
#       没发出 Release，下次也不会重复用同一个号（tag 已推，号已占）。
# 注 2：workflow_dispatch 仅用于「重发某个 tag」或验证打包流程；
#       留空 = 取最新已有 tag 原样重发，不会 +1。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '留空 = 重发最新已有 tag；填已存在的 tag（如 v1.0.3）= 重发该版本'
        required: false
        default: ''

permissions:
  contents: write

# 同一分支/标签的构建串行执行，避免并发发布互相覆盖
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: AIReplay         # 生成的 exe 名称（不含扩展名）
  ENTRY: AIReplay-check.py   # 入口脚本

jobs:
  build:
    name: 构建 exe 并发布 Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 锁死打包器版本：与本地验证过的版本一致，避免 PyInstaller 升级导致产物行为漂移
          pip install pyinstaller==6.22.3

      - name: 计算版本号（取历史最高 tag，patch +1）
        id: ver
        shell: pwsh
        run: |
          $ref   = "${{ github.ref }}"
          $event = "${{ github.event_name }}"
          $input = "${{ github.event.inputs.version }}"

          # 版本号比较用：把 v1.2.3 归一成可数值比较的 4 段键
          function ToKey([string]$v) {
              $n = ([regex]::Matches(($v -replace '^v',''), '\d+') | ForEach-Object { [int]$_.Value })
              $a = @($n)
              while ($a.Count -lt 4) { $a += 0 }
              return ($a[0..3] -join '.')
          }

          git fetch --tags --quiet
          $allTags = @(git tag --list 'v*' | Where-Object { ($_ -replace '^v','') -match '^\d+(\.\d+){1,3}$' })

          if ($input -and $input.Trim() -ne '') {
              # ── 手动指定：重发某个已存在的 tag ──
              $tag = $input.Trim()
              if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
              git rev-parse -q --verify "refs/tags/$tag" | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "tag '$tag' 不存在。重发请填一个已存在的 tag。"
              }
              $ver = $tag -replace '^v',''
              "action=reuse" >> $env:GITHUB_OUTPUT
              Write-Host "手动重发模式：$tag"
          }
          elseif ($allTags.Count -eq 0) {
              # ── 仓库里还没有任何 tag：从 v1.0.1 起步 ──
              $tag = 'v1.0.1'
              $ver = '1.0.1'
              "action=create" >> $env:GITHUB_OUTPUT
              Write-Host "首次发版（无历史 tag）：$tag"
          }
          else {
              # ── 取历史最高的 tag，patch 位 +1（只在最后一段进 1），然后自动打 tag ──
              $maxTag = $allTags | Sort-Object { ToKey $_ } -Descending | Select-Object -First 1
              $parts  = @(($maxTag -replace '^v','') -split '\.')
              # 补足到 3 段（如 v1.0 → 1.0.0）
              while ($parts.Count -lt 3) { $parts += '0' }
              $parts[$parts.Count - 1] = ([int]$parts[$parts.Count - 1] + 1).ToString()
              $ver = $parts -join '.'
              $tag = "v$ver"
              "action=create" >> $env:GITHUB_OUTPUT
              Write-Host "自动递增：$maxTag → $tag"
          }

          # 格式兜底（只允许数字和点）
          if ($ver -notmatch '^\d+(\.\d+){1,3}$') {
              throw "版本号 '$tag' 不合法。期望形如 v1.2.3（数字和点）。"
          }

          $sha  = "${{ github.sha }}".Substring(0, 7)
          $time = (Get-Date).ToUniversalTime().AddHours(8).ToString('yyyy-MM-dd HH:mm:ss') + ' (UTC+8)'

          Write-Host "版本号: $tag"
          Write-Host "提交:   $sha"
          "tag=$tag"                               >> $env:GITHUB_OUTPUT
          "name=$env:APP_NAME $tag"                >> $env:GITHUB_OUTPUT
          "ver=$ver"                               >> $env:GITHUB_OUTPUT
          "short_sha=$sha"                         >> $env:GITHUB_OUTPUT
          "build_time=$time"                       >> $env:GITHUB_OUTPUT

      - name: 版本号递增保护（不许重号 / 倒序）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 目标：确保本次版本号 > 历史所有已发布版本号。
          # 版本号一旦倒序，老用户的 number 更大，程序会判定「无更新」，更新链就断了。
          # ⚠️ 本步骤刻意排在「自动打 tag」之前：万一校验不过，远端不会被留下一个坏 tag。
          $ver = "${{ steps.ver.outputs.ver }}"

          # 重发模式：同一个 tag 再发一次是允许的，不做递增校验
          if ("${{ steps.ver.outputs.action }}" -eq 'reuse') {
              Write-Host "重发模式（tag 已存在），跳过递增校验。"
              exit 0
          }

          # 取历史所有 Release 的 tag，找出最大的版本号
          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName' 2>$null

          function ToKey([string]$v) {
              $n = ([regex]::Matches(($v -replace '^v',''), '\d+') | ForEach-Object { [int]$_.Value })
              $a = @($n)
              while ($a.Count -lt 4) { $a += 0 }
              return ($a[0..3] -join '.')
          }

          $thisKey = ToKey $ver

          # 历史最高 = Release 里的最高 ∪ 所有已存在的 tag
          # （本次 tag 此时尚未推送，候选集天然不含自身，因此可以用严格的大于比较）
          $allTags = @(git tag --list 'v*' | Where-Object { ($_ -replace '^v','') -match '^\d+(\.\d+){1,3}$' })
          $cands = @($tags) + @($allTags) | Where-Object { $_ -and ($_ -ne "${{ steps.ver.outputs.tag }}") }
          if ($cands.Count -eq 0) {
              Write-Host "无历史版本，跳过递增校验。"
              exit 0
          }

          $maxTag = ($cands | Sort-Object { ToKey $_ } -Descending | Select-Object -First 1)
          $maxKey = ToKey $maxTag

          Write-Host "本次: v$ver ($thisKey)   历史最高: $maxTag ($maxKey)"
          if ([version]$thisKey -le [version]$maxKey) {
              throw "版本号未递增：本次 v$ver 不大于历史最高 $maxTag。请检查是否手工打了一个低版本 tag。"
          }
          Write-Host "递增校验通过。"

      - name: 自动打 tag（仅自动递增时）
        if: steps.ver.outputs.action == 'create'
        shell: pwsh
        run: |
          # 号一旦推出就占用，避免下次构建重复用同一个号。
          # 幂等：若 tag 已存在（例如上次构建失败后重跑），直接复用，不报错。
          $tag = "${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              git push origin $tag
              if ($LASTEXITCODE -ne 0) { throw "推送 tag $tag 失败" }
              Write-Host "已自动推送 tag: $tag"
          } else {
              Write-Host "tag $tag 已存在，跳过创建（复用）。"
          }

      - name: 注入版本号到脚本
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.tag }}" -replace '^v', ''
          $path = Join-Path (Get-Location) $env:ENTRY

          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $pattern = '(?m)^APP_VERSION\s*=\s*"[^"]*"'
          if ($text -notmatch $pattern) {
              throw "在 $env:ENTRY 中未找到 APP_VERSION 定义行，无法注入版本号"
          }

          $new = [regex]::Replace($text, $pattern, 'APP_VERSION = "' + $ver + '"')
          [System.IO.File]::WriteAllText($path, $new, (New-Object System.Text.UTF8Encoding($false)))

          $got = [regex]::Match(
              [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8),
              $pattern).Value
          Write-Host "注入结果: $got"
          if ($got -notmatch [regex]::Escape($ver)) {
              throw "版本号注入校验失败（期望 $ver）"
          }

      - name: 打包 exe
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --clean --noupx `
            --collect-all customtkinter `
            --name "$env:APP_NAME" `
            "$env:ENTRY"

      - name: 校验打包产物
        shell: pwsh
        run: |
          $exe = "dist/$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) {
              throw "打包失败：未找到 $exe"
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("产物: {0}  ({1:N1} MB)" -f $exe, $size)

      - name: 准备发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # 发布文件名: AIReplay-<版本号>.exe
          $asset = "release/$env:APP_NAME-${{ steps.ver.outputs.tag }}.exe"
          Copy-Item "dist/$env:APP_NAME.exe" $asset
          Write-Host "发布文件: $asset"
          Get-ChildItem release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          generate_release_notes: true
          make_latest: true
          body: |
            ## 自动构建产物

            本 Release 由 GitHub Actions 在 push 到 `main` 后自动构建并上传，版本号 `${{ steps.ver.outputs.tag }}` 由 CI 依据历史 tag 自动递增得出。

            | 项目 | 内容 |
            | --- | --- |
            | 版本 | `${{ steps.ver.outputs.tag }}` |
            | 提交 | `${{ steps.ver.outputs.short_sha }}` |
            | 构建时间 | ${{ steps.ver.outputs.build_time }} |

            **下载**

            - `${{ env.APP_NAME }}-${{ steps.ver.outputs.tag }}.exe` —— 本版本可执行文件，双击即用

            **使用方法**

            1. 下载 `${{ env.APP_NAME }}-${{ steps.ver.outputs.tag }}.exe`，放到任意目录（建议单独建一个文件夹）
            2. 双击运行 → 选择抓取日期 → 点击「开始抓取并处理」
            3. 首次使用需要在弹窗中登录以获取 Token；Token 缓存在 exe 同目录的
               `.amis_token.json`，内含凭据，请勿外传或提交到仓库
